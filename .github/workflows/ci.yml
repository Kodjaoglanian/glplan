name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.x'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build linux
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/glplan
      - name: Build windows
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/glplan
