name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'

concurrency:
  group: glplan-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v0.2.0 or v0.2.0-rc.1; got '$V'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

  validate:
    name: Validate source
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "::error::gofmt needed in:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/glplan${EXT}" ./cmd/glplan
          cp README.md LICENSE dist/
          test -s "dist/glplan${EXT}"
          ls -lh "dist/glplan${EXT}"

      - name: Smoke test binary
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            got="$(./dist/glplan --version)"
            test "$got" = "$VERSION"
            echo "binary reports $got"
          else
            echo "execution smoke test skipped for cross-compiled $GOOS/$GOARCH"
          fi

      - name: Package and verify archive
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          NAME="glplan-${VERSION}-${GOOS}-${GOARCH}"
          BINARY="glplan"
          if [ "$GOOS" = "windows" ]; then BINARY="glplan.exe"; fi
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            ARCHIVE="${NAME}.tar.gz"
            tar czf "$ARCHIVE" -C dist "$BINARY" README.md LICENSE
            entries="$(tar tzf "$ARCHIVE")"
            grep -qx "$BINARY" <<< "$entries"
            grep -qx 'README.md' <<< "$entries"
            grep -qx 'LICENSE' <<< "$entries"
          else
            ARCHIVE="${NAME}.zip"
            (cd dist && zip -q "../${ARCHIVE}" "$BINARY" README.md LICENSE)
            entries="$(unzip -Z1 "$ARCHIVE")"
            grep -qx "$BINARY" <<< "$entries"
            grep -qx 'README.md' <<< "$entries"
            grep -qx 'LICENSE' <<< "$entries"
          fi
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          sha256sum -c "${ARCHIVE}.sha256"
          echo "name=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Archive verified: $ARCHIVE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: glplan-${{ needs.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs: [version, validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(artifacts/*.tar.gz artifacts/*.zip)
          if [ "${#archives[@]}" -ne 4 ]; then
            echo "::error::expected 4 release archives, found ${#archives[@]}"
            ls -la artifacts || true
            exit 1
          fi
          for archive in "${archives[@]}"; do
            base="$(basename "$archive")"
            test -s "artifacts/${base}.sha256"
            (cd artifacts && sha256sum -c "${base}.sha256")
          done
          echo "All artifact checksums verified"

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          PREV="$(git tag --sort=-version:refname | grep -Fx "$VERSION" | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            LOG="$(git log --pretty=format:'- %s (%h)' "${PREV}..HEAD")"
          else
            LOG="$(git log --pretty=format:'- %s (%h)' -30)"
          fi
          {
            echo "## Glplan $VERSION"
            echo
            echo "### Mudanças"
            echo
            echo "$LOG"
            echo
            echo "### Instalação"
            echo
            echo 'Linux (amd64/arm64):'
            echo '```bash'
            echo 'curl -fsSL https://github.com/Kodjaoglanian/glplan/raw/refs/heads/main/install.sh | bash'
            echo '```'
            echo
            echo 'Windows (PowerShell):'
            echo '```powershell'
            echo 'irm https://github.com/Kodjaoglanian/glplan/raw/refs/heads/main/install.ps1 | iex'
            echo '```'
            echo
            echo 'Depois rode `glplan`: a TUI abre direto e usa o backend local embutido quando necessário.'
            echo 'Para compartilhar um board entre máquinas ou agentes, rode `glplan serve` e aponte `GLPLAN_API_URL` para ele.'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Glplan ${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
            install.sh
            install.ps1
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
